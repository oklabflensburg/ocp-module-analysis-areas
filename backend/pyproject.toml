[project]
name = "ocp-module-analysis-areas"
version = "1.1.0"
description = "Analysis Areas module for Open City Planner"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116.1",
  "geoalchemy2>=0.17.1",
  "httpx>=0.28.1",
  "pydantic>=2.11.7",
  "sqlalchemy>=2.0.42",
]

[project.entry-points."open_city_planner.modules"]
analysis-areas = "ocp_module_analysis_areas.module:DEFINITION"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pyyaml==6.0.3",
  "ruff>=0.12.8",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocp_module_analysis_areas*"]

[tool.setuptools.package-data]
ocp_module_analysis_areas = ["migrations/history/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/ocp_module_analysis_areas/migrations/history"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
required-version = "==0.12.5"
build-constraint-dependencies = ["setuptools==84.0.0"]
