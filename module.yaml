manifest_version: 1
id: analysis-areas
name: Analysis Areas
version: 1.5.2
requires:
  host: ">=0.2.0,<1.0.0"
  sdk: ">=1.15.0,<2.0.0"
  modules:
    statistics: ">=0.2.0,<1.0.0"
optional:
  modules: {}
backend:
  package: ocp-module-analysis-areas
frontend:
  package: "@open-city-planner/analysis-areas"
