name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) uv build --wheel
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm contract:check
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  host-contract:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/build-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/host-contract-test
      - run: sha256sum -c dist/analysis-areas-1.0.0.ocp.sha256
