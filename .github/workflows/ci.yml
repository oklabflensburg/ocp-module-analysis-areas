name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

env:
  OCP_CI_RUN_KEY: ocp-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) uv build --wheel
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm contract:check
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  host-contract:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:19b6ffa248d2f864d29d6c338459f02d63c0d7ce341fa86b3bcba8484a130bff
        env:
          POSTGRES_DB: open_city_map_test
          POSTGRES_PASSWORD: ${{ env.OCP_CI_RUN_KEY }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_city_map_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure PostGIS contract database
        run: echo "DATABASE_URL=postgresql+asyncpg://postgres:${OCP_CI_RUN_KEY}@127.0.0.1:5432/open_city_map_test" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/build-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/host-contract-test
      - run: sha256sum -c dist/analysis-areas-1.2.0.ocp.sha256
