name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff check src tests && uv run pytest
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
        working-directory: frontend
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - name: Validate tag and versions
        run: |
          version=$(python -c 'import yaml; print(yaml.safe_load(open("module.yaml"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          test "$version" = "1.0.0"
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" SOURCE_COMMIT="$GITHUB_SHA" scripts/build-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/host-contract-test
      - run: sha256sum -c dist/analysis-areas-1.0.0.ocp.sha256
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing mutation." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/analysis-areas-1.0.0.ocp \
            dist/analysis-areas-1.0.0.ocp.sha256 \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "First standalone release extracted from Open City Planner built-in module"
