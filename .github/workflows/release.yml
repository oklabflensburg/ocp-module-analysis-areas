name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  OCP_CI_RUN_KEY: ocp-release-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:19b6ffa248d2f864d29d6c338459f02d63c0d7ce341fa86b3bcba8484a130bff
        env:
          POSTGRES_DB: open_city_map_test
          POSTGRES_PASSWORD: ${{ env.OCP_CI_RUN_KEY }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_city_map_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Configure PostGIS contract database
        run: echo "DATABASE_URL=postgresql+asyncpg://postgres:${OCP_CI_RUN_KEY}@127.0.0.1:5432/open_city_map_test" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          source_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$source_commit"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/ocp-module-statistics
          ref: 4525491995cddb7ad9670f456bba1a49e289f583
          path: .statistics-module
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - name: Validate tag and version
        run: backend/.venv/bin/python scripts/release_metadata.py --tag "$RELEASE_TAG" --github-env "$GITHUB_ENV"
      - run: uv run ruff check src tests && uv run pytest
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm contract:check
        working-directory: frontend
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - run: uv sync --frozen --extra dev
        working-directory: .statistics-module/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .statistics-module/frontend
      - name: Prepare Statistics 0.2.0 build contract
        run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.statistics-host-contract" scripts/prepare-host-contract
        working-directory: .statistics-module
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.statistics-host-contract" scripts/build-bundle
        working-directory: .statistics-module
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" SOURCE_COMMIT="$SOURCE_COMMIT" scripts/verify-reproducible-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" OCP_STATISTICS_BUNDLE="$GITHUB_WORKSPACE/.statistics-module/dist/statistics-0.2.0.ocp" scripts/host-contract-test
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing mutation." >&2
            exit 1
          fi
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Versioned release notes are missing: $notes_file" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$BUNDLE_ARTIFACT" \
            "$BUNDLE_CHECKSUM" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$notes_file"
