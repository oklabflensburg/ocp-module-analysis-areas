name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          source_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$source_commit"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - id: contract
        run: echo "commit=$(python -c 'import json; print(json.load(open(".github/ocp-host-contract.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/open-city-planner
          ref: ${{ steps.contract.outputs.commit }}
          path: .host-contract
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oklabflensburg/ocp-module-statistics
          ref: f78e3f49c33f550c007000a4090743ba775dbd38
          path: .statistics-module
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - name: Validate tag and version
        run: |
          version=$(cd backend && uv run python -c 'import yaml; print(yaml.safe_load(open("../module.yaml"))["version"])')
          test "$RELEASE_TAG" = "v$version"
      - run: uv run ruff check src tests && uv run pytest
        working-directory: backend
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
        working-directory: frontend
      - run: uv sync --frozen --extra dev
        working-directory: .host-contract/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .host-contract/frontend
      - run: uv sync --frozen --extra dev
        working-directory: .statistics-module/backend
      - run: pnpm install --frozen-lockfile
        working-directory: .statistics-module/frontend
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" scripts/build-bundle
        working-directory: .statistics-module
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" SOURCE_COMMIT="$SOURCE_COMMIT" scripts/build-bundle
      - run: OCP_HOST_CHECKOUT="$GITHUB_WORKSPACE/.host-contract" OCP_STATISTICS_BUNDLE="$GITHUB_WORKSPACE/.statistics-module/dist/statistics-0.2.0.ocp" scripts/host-contract-test
      - run: sha256sum -c dist/analysis-areas-1.5.0.ocp.sha256
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing mutation." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/analysis-areas-1.5.0.ocp \
            dist/analysis-areas-1.5.0.ocp.sha256 \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "First standalone release extracted from Open City Planner built-in module"
